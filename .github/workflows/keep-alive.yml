name: Keep Streamlit app awake

on:
  schedule:
    # Every 15 minutes. Streamlit Community Cloud free tier sleeps apps
    # after a period of no visits — this ping counts as a visit and
    # resets that inactivity clock, so the app never needs to cold-start
    # ("enter the oven") when someone actually opens the link.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 15 --max-time 60 \
            https://pienza.streamlit.app
