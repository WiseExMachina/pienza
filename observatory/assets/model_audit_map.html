<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 Model Audit — Zone Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/h3-js@4/dist/h3-js.umd.js"></script>
<script src="./zone-paths.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#f7f8f8; }
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background:#d9dede; border-radius:4px; }
  .zone-label-tooltip {
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 3px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    white-space: nowrap;
  }
  .zone-label-tooltip::before { display: none; }
  .zone-label-true { background: #156b66; }
  .zone-label-pred { background: #475569; }
  .zone-label-other { background: #94a3b8; }
  #map { position:absolute; inset:0; }
  #map:focus, .leaflet-container:focus,
  .leaflet-container a:focus,
  .leaflet-interactive:focus { outline: none; }
  .stage {
    position:relative;
    width:100%;
    height:100%;
    margin:0 auto;
    overflow:hidden;
    background:#f7f8f8;
    font-family:'Inter',sans-serif;
  }
  .panel {
    position:absolute; top:16px; left:16px; width:260px;
    max-height:calc(100% - 32px); height:calc(100% - 32px);
    z-index:1000; display:flex; flex-direction:column;
    background:rgba(255,255,255,0.97); backdrop-filter:blur(6px);
    border:1px solid #eaeaea; border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.10); overflow:hidden;
  }
  .legend {
    position:absolute; bottom:16px; right:16px; z-index:1000;
    background:rgba(255,255,255,0.97); backdrop-filter:blur(6px);
    border:1px solid #eaeaea; border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.10);
    padding:12px 14px; display:flex; flex-direction:column; gap:7px;
  }
  .legend-row { display:flex; align-items:center; gap:8px; font-size:11.5px; color:#475569; }
  .legend-row.muted { color:#94a3b8; }
  .swatch { width:11px; height:11px; border-radius:3px; display:inline-block; }
  .tab { flex:1; text-align:center; border-radius:999px; padding:5px 0; font-weight:700; font-size:11px; cursor:pointer; border:1.3px solid transparent; transition:background .12s; }
  .tab.active-hit { background:#21918c; color:#fff; border-color:#21918c; }
  .tab.active-miss { background:#94a3b8; color:#fff; border-color:#94a3b8; }
  .tab.inactive { background:#f8fafc; color:#94a3b8; }
  .shuffle { border-radius:999px; padding:4px 11px; font-weight:700; font-size:10.5px; cursor:pointer; color:#fff; }
  .shuffle.hit { background:#21918c; border:1.3px solid #21918c; }
  .shuffle.miss { background:#94a3b8; border:1.3px solid #94a3b8; }
  .row { padding:8px 2px; border-bottom:1px solid #f1f1f1; cursor:default; transition:background .12s; }
  .row:hover { background:rgba(33,145,140,0.06); }
  .row.miss:hover { background:#f8fafc; }
  .addr { font-family:'Courier New',monospace; font-size:10px; color:#334155; margin-bottom:4px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
</style>
</head>
<body>
<div class="stage">
  <div id="map"></div>

  <div class="panel">
    <div style="padding:12px 14px 0;">
      <div style="font-size:10px; font-weight:700; letter-spacing:0.5px; color:#121212; text-transform:uppercase;">Model Audit Explorer</div>
      <div style="font-size:11.5px; color:#64748b; margin-top:2px; margin-bottom:10px;">CDMX · miniBabel classifier</div>
    </div>
    <div style="display:flex; gap:5px; padding:0 14px 10px;">
      <button class="tab active-hit" id="btn-hits" onclick="setTab('hits')">Hits</button>
      <button class="tab inactive" id="btn-misses" onclick="setTab('misses')">Misses</button>
    </div>
    <div style="height:1px; background:#eaeaea;"></div>
    <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px 6px;">
      <div style="font-size:10.5px; color:#94a3b8;" id="count-label">loading…</div>
      <button class="shuffle hit" id="btn-shuffle" onclick="shuffle()">Shuffle</button>
    </div>
    <div id="list" style="flex:1; min-height:0; overflow-y:auto; padding:0 14px 14px;"></div>
  </div>

  <div class="legend">
    <div class="legend-row"><span class="swatch" style="background:#21918c;"></span> Hit zone / true zone</div>
    <div class="legend-row"><span class="swatch" style="background:#64748b;"></span> Predicted (miss)</div>
    <div class="legend-row muted"><span class="swatch" style="background:#e9edec; border:1px solid #dfe4e3;"></span> Other zones</div>
  </div>
</div>

<script>
// ── DATA ──
let hitsPool = [], missesPool = [], hitsSample = [], missesSample = [];
let activeTab = 'hits';
let hovered = null; // { _predKey, _trueKey, _isHit }
let leafletMap, geoLayer, hexLayer, hexPolys, hexRowsRef, labelLayer;
const ALIASES = (window.ZONE_ALIASES) || {};

// ── ZONE RESOLUTION ──
function resolveMembers(name) {
  if (!name) return new Set();
  const parts = String(name).split('__').filter(Boolean);
  const expanded = new Set();
  for (const p of parts) {
    expanded.add(p);
    if (ALIASES[p]) expanded.add(ALIASES[p]);
    for (const k in ALIASES) { if (ALIASES[k] === p) expanded.add(k); }
  }
  return expanded;
}
const ZONE_ACRONYMS = { aicm:'AICM', bnp:'BNP', asf:'ASF', wtc:'WTC', hq:'HQ', fc:'FC', itesm:'ITESM', soho:'SoHo', jp:'JP' };
function toLabel(key) {
  if (!key) return '—';
  const titleCase = s => s.split('_').filter(Boolean).map(w => ZONE_ACRONYMS[w.toLowerCase()] || (w[0].toUpperCase() + w.slice(1))).join(' ');
  return String(key).split('__').filter(Boolean).map(titleCase).join(', ');
}
function obfuscate(text) {
  if (typeof text !== 'string') return text;
  return text.replace(/\d+/g, m => m.length === 5 ? m : '#'.repeat(m.length));
}

// ── STYLING ──
function matchStyleFor(name, kind) {
  if (!hovered) {
    return kind === 'hex'
      ? { fillColor:'#94a3b8', fillOpacity:0.28, color:'#94a3b8', weight:0.5 }
      : { fillColor:'#94a3b8', fillOpacity:0.12, color:'#94a3b8', weight:1 };
  }
  const trueM = resolveMembers(hovered._trueKey);
  const predM = resolveMembers(hovered._predKey);
  if (trueM.has(name)) return { fillColor:'#21918c', fillOpacity:0.8, color:'#156b66', weight:1.6 };
  if (!hovered._isHit && predM.has(name)) return { fillColor:'#64748b', fillOpacity:0.8, color:'#475569', weight:1.6 };
  return kind === 'hex'
    ? { fillColor:'#94a3b8', fillOpacity:0.12, color:'#94a3b8', weight:0.5 }
    : { fillColor:'#94a3b8', fillOpacity:0.06, color:'#94a3b8', weight:1 };
}

// ── LABEL COLLISION SOLVER ──
const _measureCtx = document.createElement('canvas').getContext('2d');
_measureCtx.font = "600 11px 'Inter', sans-serif";
function measureLabelWidth(text) { return _measureCtx.measureText(text).width; }
function labelRectAt(z, radius) {
  const { anchorPx, dominant, width, height } = z;
  const pad = 2;
  let x, y;
  if (dominant==='top') { x=anchorPx.x-width/2; y=anchorPx.y-radius-height; }
  else if (dominant==='bottom') { x=anchorPx.x-width/2; y=anchorPx.y+radius; }
  else if (dominant==='left') { x=anchorPx.x-radius-width; y=anchorPx.y-height/2; }
  else { x=anchorPx.x+radius; y=anchorPx.y-height/2; }
  return { x:x-pad, y:y-pad, w:width+pad*2, h:height+pad*2 };
}
function rectsOverlap(a,b) {
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function resolveLabelCollisions(shapes) {
  const STEP=4, MAX_RADIUS=60, MAX_ITERS=30;
  let iter=0, moved=true;
  while (moved && iter<MAX_ITERS) {
    moved=false; iter++;
    for (let i=0;i<shapes.length;i++) for (let j=i+1;j<shapes.length;j++) {
      const a=shapes[i],b=shapes[j];
      if (rectsOverlap(labelRectAt(a,a.radius),labelRectAt(b,b.radius))) {
        if (a.radius<=b.radius && a.radius<MAX_RADIUS) { a.radius+=STEP; moved=true; }
        else if (b.radius<MAX_RADIUS) { b.radius+=STEP; moved=true; }
        else if (a.radius<MAX_RADIUS) { a.radius+=STEP; moved=true; }
      }
    }
  }
}

// ── LABELS ──
function updateLabels() {
  if (!labelLayer || !leafletMap.hasLayer(labelLayer)) labelLayer = L.layerGroup().addTo(leafletMap);
  labelLayer.clearLayers();
  if (!hovered) return;
  const trueMembers = resolveMembers(hovered._trueKey);
  const predMembers = hovered._isHit ? new Set() : resolveMembers(hovered._predKey);
  const allMembers = [...trueMembers, ...[...predMembers].filter(m=>!trueMembers.has(m))];
  const shapes = [];
  for (const name of allMembers) {
    let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity,any=false;
    const consider = b => { const sw=b.getSouthWest(),ne=b.getNorthEast(); if(sw.lat<minLat)minLat=sw.lat; if(ne.lat>maxLat)maxLat=ne.lat; if(sw.lng<minLng)minLng=sw.lng; if(ne.lng>maxLng)maxLng=ne.lng; any=true; };
    if (geoLayer) geoLayer.eachLayer(l => { if (l.feature.properties.name===name) consider(l.getBounds()); });
    if (hexPolys && hexRowsRef) hexPolys.forEach((p,i) => { if (hexRowsRef[i].final_zone_name===name) consider(p.getBounds()); });
    if (!any) continue;
    shapes.push({ name, isTrue:trueMembers.has(name), minLat,maxLat,minLng,maxLng, centerLat:(minLat+maxLat)/2, centerLng:(minLng+maxLng)/2 });
  }
  if (!shapes.length) return;
  const groupLat=shapes.reduce((s,z)=>s+z.centerLat,0)/shapes.length;
  const groupLng=shapes.reduce((s,z)=>s+z.centerLng,0)/shapes.length;
  const lngScale=Math.cos(groupLat*Math.PI/180);
  const sectorCounts={};
  shapes.forEach((z,idx)=>{
    let dx=(z.centerLng-groupLng)*lngScale, dy=z.centerLat-groupLat;
    if (Math.abs(dx)<1e-9&&Math.abs(dy)<1e-9) { const a=(idx*47)%360; dx=Math.cos(a*Math.PI/180); dy=Math.sin(a*Math.PI/180); }
    const angleDeg=((Math.atan2(dy,dx)*180/Math.PI)+360)%360;
    const sector=Math.round(angleDeg/45)%8;
    z.dupIdx=sectorCounts[sector]||0; sectorCounts[sector]=(z.dupIdx)+1; z.angleDeg=angleDeg;
  });
  shapes.forEach((z,idx)=>{
    const rad=z.angleDeg*Math.PI/180;
    z.ux=Math.cos(rad); z.uy=Math.sin(rad);
    z.anchorLat=z.uy>=0?z.maxLat:z.minLat; z.anchorLng=z.ux>=0?z.maxLng:z.minLng;
    z.dominant=Math.abs(z.uy)>=Math.abs(z.ux)?(z.uy>=0?'top':'bottom'):(z.ux>=0?'right':'left');
    z.label=toLabel(z.name); z.width=measureLabelWidth(z.label)+16; z.height=23;
    z.radius=16+z.dupIdx*6;
    try { z.anchorPx=leafletMap.latLngToContainerPoint([z.anchorLat,z.anchorLng]); } catch(e) { z.anchorPx={x:idx*40,y:idx*40}; }
  });
  resolveLabelCollisions(shapes);
  shapes.forEach(z=>{
    const marker=L.marker([z.anchorLat,z.anchorLng],{icon:L.divIcon({className:'',html:'',iconSize:[0,0]}),interactive:false});
    marker.bindTooltip(z.label,{permanent:true,direction:z.dominant,offset:[Math.round(z.ux*z.radius),Math.round(-z.uy*z.radius)],className:'zone-label-tooltip '+(z.isTrue?'zone-label-true':'zone-label-pred'),opacity:1});
    labelLayer.addLayer(marker); marker.openTooltip();
  });
}

// ── RESTYLE ──
function restyleMap() {
  if (geoLayer) geoLayer.eachLayer(l => l.setStyle(matchStyleFor(l.feature.properties.name,'poly')));
  if (hexPolys && hexRowsRef) hexPolys.forEach((p,i) => p.setStyle(matchStyleFor(hexRowsRef[i].final_zone_name,'hex')));
  updateLabels();
}

// ── HOVER ──
function setHover(rec) {
  hovered = rec ? { _predKey:rec._predKey, _trueKey:rec._trueKey, _isHit:rec._isHit } : null;
  restyleMap();
}

// ── RENDER LIST ──
function renderList() {
  const list = document.getElementById('list');
  const items = activeTab === 'hits' ? hitsSample : missesSample;
  const isHit = activeTab === 'hits';
  list.innerHTML = '';
  items.forEach(rec => {
    const row = document.createElement('div');
    row.className = 'row' + (isHit ? '' : ' miss');
    row.onmouseenter = () => setHover(rec);
    row.onmouseleave = () => setHover(null);
    if (isHit) {
      row.innerHTML = `
        <div class="addr">${rec.address}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:10.5px;">
          <span style="color:#21918c;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${rec.predictedLabel}</span>
          <span style="color:#94a3b8;font-weight:700;flex-shrink:0;margin-left:6px;">${rec.confidencePct}%</span>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="addr">${rec.address}</div>
        <div style="font-size:10.5px;color:#64748b;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;">
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Pred: <b style="color:#475569;">${rec.predictedLabel}</b></span>
          <span style="color:#94a3b8;font-weight:700;flex-shrink:0;margin-left:6px;">${rec.confidencePct}%</span>
        </div>
        <div style="font-size:10.5px;color:#64748b;">True: <b style="color:#21918c;">${rec.trueLabel}</b></div>`;
    }
    list.appendChild(row);
  });
  document.getElementById('count-label').textContent = isHit
    ? `5 of ${hitsPool.length} hits`
    : `5 of ${missesPool.length} misses`;
}

// ── TABS ──
function setTab(tab) {
  activeTab = tab;
  const bh = document.getElementById('btn-hits');
  const bm = document.getElementById('btn-misses');
  const bs = document.getElementById('btn-shuffle');
  bh.className = 'tab ' + (tab==='hits' ? 'active-hit' : 'inactive');
  bm.className = 'tab ' + (tab==='misses' ? 'active-miss' : 'inactive');
  bs.className = 'shuffle ' + (tab==='hits' ? 'hit' : 'miss');
  renderList();
}
function sampleN(arr, n) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); const tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a.slice(0,n);
}
function shuffle() {
  if (activeTab==='hits') hitsSample = sampleN(hitsPool, 5);
  else missesSample = sampleN(missesPool, 5);
  renderList();
}

// ── MAP INIT ──
function initMap() {
  const map = L.map('map', {
    zoomControl:false, attributionControl:false,
    zoomSnap:0.5, zoomDelta:0.5, wheelPxPerZoomLevel:360,
  }).setView([19.4,-99.22],12);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
  const geojson = window.ZONE_GEOJSON || {type:'FeatureCollection',features:[]};
  geoLayer = L.geoJSON(geojson, {
    style: f => matchStyleFor(f.properties.name,'poly'),
    onEachFeature: (feature, layer) => {
      layer.bindTooltip(toLabel(feature.properties.name), { className: 'zone-label-tooltip zone-label-other', sticky: true });
    },
  }).addTo(map);
  leafletMap = map;

  // H3 hex layer with polling for h3-js CDN
  (function tryHex(attempt) {
    const rows = window.ZONE_HEX_ROWS || [];
    if (!rows.length) return;
    if (typeof h3 === 'undefined') { if (attempt<100) setTimeout(()=>tryHex(attempt+1),100); return; }
    const feats = rows.map(r => {
      const poly = L.polygon(h3.cellToBoundary(r.h3_index,false), matchStyleFor(r.final_zone_name,'hex'));
      poly.bindTooltip(toLabel(r.final_zone_name), { className: 'zone-label-tooltip zone-label-other', sticky: true });
      return poly;
    });
    hexLayer = L.layerGroup(feats).addTo(map);
    hexRowsRef = rows; hexPolys = feats;
    restyleMap();
  })(0);

  const CITY_MAX_ZOOM = 14;
  const settleAndFit = () => {
    map.invalidateSize();
    if (geoLayer.getBounds().isValid()) map.fitBounds(geoLayer.getBounds(), {paddingTopLeft:[220,10],paddingBottomRight:[10,10],maxZoom:CITY_MAX_ZOOM});
  };
  requestAnimationFrame(()=>requestAnimationFrame(settleAndFit));
  setTimeout(settleAndFit, 500);
  if (typeof ResizeObserver !== 'undefined') {
    let lastW=0,lastH=0,fittedOnce=false;
    new ResizeObserver(entries=>{
      const r=entries[0].contentRect;
      if (Math.round(r.width)===lastW && Math.round(r.height)===lastH) return;
      lastW=Math.round(r.width); lastH=Math.round(r.height);
      map.invalidateSize();
      if (!fittedOnce && lastW>100 && lastH>100 && geoLayer.getBounds().isValid()) {
        fittedOnce=true;
        map.fitBounds(geoLayer.getBounds(),{paddingTopLeft:[220,10],paddingBottomRight:[10,10],maxZoom:CITY_MAX_ZOOM});
      }
    }).observe(document.getElementById('map'));
  }
}

// ── LOAD DATA ──
// Rows are injected server-side by Streamlit as window.AUDIT_ROWS (see 0008_The_Quest_to_O1_NLP.py,
// P3 tab) -- reuses the app's existing GCS-backed parquet loader instead of fetching/parsing
// the parquet client-side, so this always reflects the live production holdout data.
function loadData() {
  try {
    const rows = window.AUDIT_ROWS || [];
    const norm = rows.map(r => ({
      raw_address: r.raw_address, real_zone_name: r.real_zone_name,
      predicted_zone: r.predicted_zone,
      confidence: typeof r.confidence==='number' ? r.confidence : parseFloat(r.confidence),
      correct: !!r.correct,
    }));
    hitsPool = norm.filter(r=>r.correct).map(h=>({
      address:obfuscate(h.raw_address), predictedLabel:toLabel(h.real_zone_name),
      confidencePct:Math.round(h.confidence*100), _predKey:h.real_zone_name, _trueKey:h.real_zone_name, _isHit:true
    }));
    missesPool = norm.filter(r=>!r.correct).map(m=>({
      address:obfuscate(m.raw_address), predictedLabel:toLabel(m.predicted_zone),
      trueLabel:toLabel(m.real_zone_name), confidencePct:Math.round(m.confidence*100),
      _predKey:m.predicted_zone, _trueKey:m.real_zone_name, _isHit:false
    }));
    hitsSample = hitsPool.slice().sort((a,b)=>b.confidencePct-a.confidencePct).slice(0,5);
    missesSample = missesPool.slice().sort((a,b)=>b.confidencePct-a.confidencePct).slice(0,5);
    renderList();
  } catch(e) {
    console.error('[ZoneMap] failed to load AUDIT_ROWS', e);
    document.getElementById('count-label').textContent = 'data error';
  }
}

// ── BOOT ──
initMap();
loadData();
</script>
</body>
</html>
